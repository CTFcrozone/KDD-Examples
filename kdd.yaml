vars:
  - from_file: crates/services/web-server/Cargo.toml
    extract: ["version"]
  - from_env: ["USER"]
---
system: rust10x
image_tag: "{{version}}"
block_base_dir: crates/services/

realms:
  _base_:
    web_external_ports: 8081

  dev:
    yaml_dir: k8s/dev/
    context: minikube
    registry: 192.168.0.104:5000
    confirm_delete: false

blocks:
  - name: db
  - name: queue
  - name: web-server
