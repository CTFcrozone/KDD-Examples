apiVersion: v1
kind: Service
metadata:
  name: rust10x-queue-srv
  labels:
    run: rust10x-queue
spec:
  type: LoadBalancer
  ports:
    - port: 6379
      protocol: TCP
      targetPort: 6379
  selector:
    run: rust10x-queue # this will select from the template.spec.metadata.labels (the pod)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust10x-queue-dep
  labels:
    run: rust10x-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      run: rust10x-queue
  template:
    metadata:
      labels:
        run: rust10x-queue
    spec:
      # The host-sys volume and init containers are to disable the THP for redis.
      # Will be disabled at the node level, but other services do not need THP to function properly.
      volumes:
        - name: host-sys
          hostPath:
            path: /sys
      initContainers:
        - name: disable-thp
          image: busybox
          volumeMounts:
            - name: host-sys
              mountPath: /host-sys
          command:
            [
              "sh",
              "-c",
              "echo never >/host-sys/kernel/mm/transparent_hugepage/enabled",
            ]
      containers:
        - image: "localhost:5000/rust10x-queue:{{image_tag}}"
          imagePullPolicy: Always
          name: rust10x-queue-ctn
          env:
            - name: service_name
              value: queue
          ports:
            - containerPort: 6379
              protocol: TCP
      restartPolicy: Always
