apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust10x-valkey
  namespace: rust10x-web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust10x-valkey
  template:
    metadata:
      labels:
        app: rust10x-valkey
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: valkey
          image: valkey/valkey:8.1.3-bookworm
          ports:
            - containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
